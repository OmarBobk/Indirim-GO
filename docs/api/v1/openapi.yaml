openapi: 3.1.0
info:
  title: İndirimGo Mobile API
  version: 1.3.0
  description: |
    Authoritative contract for the customer-only İndirimGo Mobile API
    (M1 authentication + M2.1 catalog read models + M3.1 single-line purchase
    + M4.1 owned order history and fulfillment status).
    Laravel is authoritative for authentication, authorization, validation,
    catalog visibility, trusted price calculation, wallet spend checks,
    checkout, and customer-owned order/fulfillment status projection.
    Flutter must never compute authoritative prices or totals.
    When `prices_visible=false`, catalog money fields are null and quote/checkout
    return HTTP 409 `purchasing_unavailable` without ending the session.
    Wallet summary remains available to its owner. Checkout requires an
    `Idempotency-Key` header; only a hash of the key is stored (72-hour retention).
    Order history money fields are historical ledger snapshots and remain present
    even when catalog prices are hidden. Fulfillment progress is projected from
    fulfillment rows, not from `orders.status` alone.

    Messages are localized from `Accept-Language`. Only `ar` and `en` are
    supported; unsupported or missing values fall back through the established
    mobile locale resolver (`SupportedLocale`, primary `config('app.locale')`).
    Catalog `name` and `description` values are returned exactly as stored
    (no catalog translation maps).

    Money `amount` values are authoritative USD ledger totals as decimal
    strings. `display` is presentation-only through trusted server formatting
    and must not be parsed for calculations. Flutter must never compute
    authoritative prices, loyalty, overrides, currency conversion, or custom
    totals.

    Local development normally uses `http://localhost:8000/api/v1`. An Android
    emulator reaches that same host through `http://10.0.2.2:8000/api/v1`.
    Clients must configure the base URL per environment instead of hardcoding it.
servers:
  - url: http://localhost:8000/api/v1
    description: Local Laravel server
  - url: http://10.0.2.2:8000/api/v1
    description: Local Laravel server from an Android emulator
tags:
  - name: Authentication
  - name: Account
  - name: Catalog
  - name: Wallet
  - name: Checkout
  - name: Orders
paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate a customer
      description: |
        Authenticates by normalized username and password. A token is returned
        only when every authentication requirement succeeds. Customers with
        confirmed Fortify two-factor authentication receive a one-time,
        five-minute challenge instead.
      operationId: mobileLogin
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication completed and a 30-day token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationSuccess'
        '202':
          description: Password accepted; two-factor authentication is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorChallengeRequired'
        '403':
          $ref: '#/components/responses/CustomerRoleRequired'
        '422':
          description: Validation failed, credentials are invalid, or the account cannot log in.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                invalidCredentialsEnglish:
                  value:
                    message: These credentials do not match our records.
                    code: invalid_credentials
                invalidCredentialsArabic:
                  value:
                    message: بيانات الاعتماد هذه غير متطابقة مع سجلاتنا.
                    code: invalid_credentials
                inactiveArabic:
                  value:
                    message: حسابك غير نشط. يرجى الاتصال بالدعم.
                    code: account_inactive
                validationEnglish:
                  value:
                    message: The given data was invalid.
                    errors:
                      username:
                        - The username field is required.
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/two-factor-challenge:
    post:
      tags: [Authentication]
      summary: Complete a mobile two-factor challenge
      description: |
        Accepts exactly one authenticator code or recovery code. The opaque
        challenge is single-use, expires after approximately five minutes,
        permits at most five invalid verification attempts, and is bound to the
        customer and validated device name established at password login.
        A successful recovery code is replaced using Fortify behavior.
      operationId: completeMobileTwoFactorChallenge
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorChallengeRequest'
      responses:
        '200':
          description: Two-factor authentication completed and a 30-day token was issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticationSuccess'
        '403':
          $ref: '#/components/responses/CustomerRoleRequired'
        '422':
          description: Validation failed or the challenge/code is invalid, expired, replayed, or over-attempted.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                invalidCodeEnglish:
                  value:
                    message: The two-factor authentication code is invalid.
                    code: invalid_two_factor_code
                expiredChallengeArabic:
                  value:
                    message: تحدي المصادقة الثنائية غير صالح أو منتهي الصلاحية.
                    code: invalid_two_factor_challenge
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current mobile token
      description: Revokes only the bearer token used for this request.
      operationId: mobileLogout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Current token revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
  /me:
    get:
      tags: [Account]
      summary: Return the current mobile customer
      operationId: mobileMe
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Current customer profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
  /catalog/home:
    get:
      tags: [Catalog]
      summary: Authenticated catalog home shelves
      description: |
        Returns frequently ordered package summaries (customer-scoped, max 8),
        featured packages (admin `order` then `name`, max 8; not sales-ranked;
        only packages with at least one active product are considered before the
        limit), and active root category chips (max 12). Featured and frequently
        ordered entries include only active packages that have at least one
        active product. Catalog responses are private and must not be shared-cached.
      operationId: mobileCatalogHome
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Catalog home shelves.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogHomeSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /packages:
    get:
      tags: [Catalog]
      summary: List active packages
      description: |
        Lists active packages that have at least one active product.
        Optional `category_id` uses exact active category matching only
        (parent categories do not include descendants). Optional `q` searches
        package name and description (trimmed, min 2, max 100) with deterministic
        ordering by admin `order` then `name`. Characters `%`, `_`, and `\` in `q`
        are matched literally (not as SQL LIKE wildcards). Offset pagination is stable.
        Missing or inactive `category_id` values are validation errors.
      operationId: mobileListPackages
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: category_id
          in: query
          required: false
          description: Exact active category id filter. Descendants are not included.
          schema:
            type: integer
            minimum: 1
        - name: q
          in: query
          required: false
          description: |
            Trimmed literal substring search against package name and description.
            `%`, `_`, and `\` are treated as ordinary characters, not LIKE wildcards.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 24
      responses:
        '200':
          description: Paginated package summaries.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '422':
          description: Validation failed (including inactive/missing category_id).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /packages/{package}:
    get:
      tags: [Catalog]
      summary: Show an active package with product options
      description: |
        Returns one active package that has at least one active product.
        Numeric package ids are the public identifiers; `slug` is informational
        and not unique. Missing, inactive, or active-but-empty packages return
        `package_not_found`. Includes a sanitized `requirements` array for the
        purchase form (no raw Laravel validation strings, regex, supplier or
        automation fields). Products do not expose a synthetic availability flag
        because the domain has no stock concept. Custom products with
        configurations checkout would reject still appear with schema-safe
        `custom_amount` metadata, but `minimum_price` is null and they never
        contribute to `from_price`.
      operationId: mobileShowPackage
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: package
          in: path
          required: true
          description: Numeric package id.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Package detail with active product options.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageDetailSuccess'
              examples:
                english:
                  value:
                    data:
                      id: 42
                      name: Example Game Top-up
                      slug: example-game-top-up
                      description: Digital top-up options.
                      image_url: https://example.test/images/packages/abc.webp
                      products_count: 2
                      from_price:
                        amount: "5.00"
                        currency: USD
                        display:
                          currency: USD
                          formatted: $5.00
                      category:
                        id: 3
                        name: Games
                        slug: games
                      products:
                        - id: 901
                          name: 100 Coins
                          amount_mode: fixed
                          unit_price:
                            amount: "5.00"
                            currency: USD
                            display:
                              currency: USD
                              formatted: $5.00
                          custom_amount: null
                          minimum_price: null
                        - id: 902
                          name: Custom amount
                          amount_mode: custom
                          unit_price: null
                          custom_amount:
                            min: 100
                            max: 10000
                            step: 100
                            unit_label: Coins
                          minimum_price:
                            amount: "5.00"
                            currency: USD
                            display:
                              currency: USD
                              formatted: $5.00
                      requirements:
                        - key: id
                          label: Player ID
                          input_type: text
                          required: true
                          max_length: 64
                          options: null
                    meta:
                      prices_visible: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '404':
          $ref: '#/components/responses/PackageNotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /wallet/summary:
    get:
      tags: [Wallet]
      summary: Customer wallet available-to-spend summary
      description: |
        Returns the authenticated customer's `available_to_spend` using
        WalletSpendPolicy semantics. Remains available when catalog prices are
        hidden. Never exposes another customer or internal credit-rule fields.
      operationId: mobileWalletSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Wallet summary.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletSummarySuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /checkout/quote:
    post:
      tags: [Checkout]
      summary: Build a server-authoritative single-line purchase quote
      description: |
        Accepts exactly one item (`minItems=1`, `maxItems=1`). Revalidates
        product/package, quantity or custom amount, and package requirements,
        then returns Money totals and a tamper-resistant `quote_fingerprint`.
        Client price fields are prohibited. When `prices_visible=false`, returns
        409 `purchasing_unavailable` without ending the session.
      operationId: mobileCheckoutQuote
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutQuoteRequest'
      responses:
        '200':
          description: Informational quote.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutQuoteSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '409':
          description: Purchasing unavailable because prices are hidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation or product/business rule failure.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /checkout:
    post:
      tags: [Checkout]
      summary: Confirm a single-line wallet purchase
      description: |
        Requires `Idempotency-Key` and `quote_fingerprint`. Reprices and
        revalidates before any order creation or wallet debit. Fingerprint
        mismatch returns 409 `price_changed` with `details.current_quote`.
        Same customer + same key + same purchase intent replays the receipt.
        Same key + different intent returns 409 `idempotency_conflict`.
        Distinct keys are distinct purchase attempts even for the same product.
        Paid order, wallet debit, required fulfillments, and durable attempt
        linkage (`order_id` / completed) commit atomically; receipt JSON may be
        reconstructed from the linked owned order. Stale processing attempts are
        reconciled safely and never clear completed linkage. Terminal attempts
        are retained for 72 hours, then pruned; retries after retention are not
        guaranteed to replay.
      operationId: mobileCheckout
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '200':
          description: Durable purchase receipt (new or replayed).
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSuccess'
        '202':
          description: Matching checkout already in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '409':
          description: Price changed, purchasing unavailable, or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Validation or insufficient wallet balance.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /checkout/status:
    get:
      tags: [Checkout]
      summary: Recover checkout result by Idempotency-Key
      description: |
        Requires `Idempotency-Key` header (never in the URL). Scoped to the
        authenticated customer. Use when the checkout HTTP response was lost.
        Reconciles linked paid orders and missing receipt snapshots so a polling
        client is not permanently stuck when only status is retried.

        When a stale unlinked attempt has no recoverable paid order/debit, the
        API transitions the attempt to a safe retryable state and returns
        `409 checkout_retry_required`. Flutter must resubmit the identical
        checkout payload with the same Idempotency-Key — never invent a new key
        for an unknown result. A different payload with the same key remains
        `409 idempotency_conflict`.
      operationId: mobileCheckoutStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Completed or terminal failed attempt.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatusSuccess'
        '202':
          description: Attempt still processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutStatusProcessing'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '404':
          description: No attempt for this customer and key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Stale unlinked attempt with no paid order. Resubmit the identical
            checkout using the same Idempotency-Key (`checkout_retry_required`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders:
    get:
      tags: [Orders]
      summary: List owned customer orders
      description: |
        Returns a paginated list of orders owned by the authenticated customer.
        Sorted stably by `created_at` descending, then `id` descending.
        No search or filters. Requirement values, provider fields, claim metadata,
        automation diagnostics, and internal pricing are never included.
        Fulfillment progress is projected from fulfillment rows.
      operationId: mobileListOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: Owned order history page (may be empty).
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '422':
          description: Validation failed for page or per_page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{order_number}:
    get:
      tags: [Orders]
      summary: Owned order purchase receipt
      description: |
        Returns the owned order receipt for the authenticated customer, including
        additive M4.1 fulfillment projection fields. Missing and cross-customer
        orders both return 404 `order_not_found`. Requirement values and
        supplier/automation fields are never included. Response wrapper remains
        `CheckoutSuccess` for M3 client compatibility.
      operationId: mobileShowOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: order_number
          in: path
          required: true
          schema:
            type: string
            pattern: '^ORD-[A-Za-z0-9\-]+$'
      responses:
        '200':
          description: Owned receipt with fulfillment status.
          headers:
            Cache-Control:
              schema:
                type: string
                const: 'private, no-store'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSuccess'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenToken'
        '404':
          description: Order not found for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: |
        Laravel Sanctum personal access token. Mobile tokens have only the
        `mobile:access` ability and an explicit `expires_at` 30 days after issue.
        A real bearer PAT is required; Laravel web-session cookies are not accepted
        for these protected mobile routes. There is no refresh-token endpoint;
        users authenticate again after expiry.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Preferred response language. Supported primary language tags are `ar` and `en`.
      schema:
        type: string
        examples: [en, ar, 'ar-SA,ar;q=0.9,en;q=0.8']
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Client-generated unique key for a purchase attempt. Laravel stores only a
        SHA-256 hash scoped to the authenticated customer. Missing/blank keys
        return `idempotency_key_required`; oversized keys return
        `idempotency_key_invalid` without echoing the raw key. Terminal attempts
        are retained for 72 hours then pruned; retries after retention are not
        guaranteed to replay. Never place the raw key in URLs or logs.
      schema:
        type: string
        minLength: 1
        maxLength: 128
  responses:
    Unauthenticated:
      description: Token is missing, invalid, expired, revoked, or the account became invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            english:
              value:
                message: Unauthenticated.
                code: unauthenticated
            blockedArabic:
              value:
                message: انتهت صلاحية الوصول لأن هذا الحساب أصبح محظورًا.
                code: account_blocked
    CustomerRoleRequired:
      description: Valid credentials belong to an identity that cannot use the customer mobile app.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            message: This account cannot use the customer mobile application.
            code: customer_role_required
    ForbiddenToken:
      description: The identity is not a customer or the token lacks the required mobile ability.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            role:
              value:
                message: This account cannot use the customer mobile application.
                code: customer_role_required
            ability:
              value:
                message: This token cannot access the mobile API.
                code: missing_mobile_ability
    TooManyRequests:
      description: Rate limit exceeded. The `Retry-After` response header is preserved.
      headers:
        Retry-After:
          description: Seconds until another request may be attempted.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            english:
              value:
                message: Too many attempts. Please try again later.
                code: too_many_requests
            arabic:
              value:
                message: محاولات كثيرة جدًا. يرجى المحاولة لاحقًا.
                code: too_many_requests
    PackageNotFound:
      description: The package is missing or inactive.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            english:
              value:
                message: Package not found.
                code: package_not_found
            arabic:
              value:
                message: الحزمة غير موجودة.
                code: package_not_found
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 255
          description: Fortify username identifier; lowercased when configured.
          example: omar
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 255
          writeOnly: true
        device_name:
          type: [string, 'null']
          maxLength: 80
          example: Omar Android
    TwoFactorChallengeRequest:
      type: object
      required: [challenge_token]
      properties:
        challenge_token:
          type: string
          minLength: 43
          maxLength: 255
          writeOnly: true
        code:
          type: [string, 'null']
          pattern: '^[0-9]{6}$'
          writeOnly: true
          description: Six-digit authenticator code. Mutually exclusive with `recovery_code`.
        recovery_code:
          type: [string, 'null']
          minLength: 1
          maxLength: 255
          writeOnly: true
          description: Fortify recovery code. Mutually exclusive with `code`.
      oneOf:
        - required: [code]
          properties:
            code:
              type: string
            recovery_code:
              type: 'null'
        - required: [recovery_code]
          properties:
            code:
              type: 'null'
            recovery_code:
              type: string
              minLength: 1
    AuthenticationSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [token, user]
          properties:
            token:
              $ref: '#/components/schemas/Token'
            user:
              $ref: '#/components/schemas/MobileUser'
    TwoFactorChallengeRequired:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [two_factor_required, challenge_token, expires_at]
          properties:
            two_factor_required:
              type: boolean
              const: true
            challenge_token:
              type: string
              description: Opaque one-time credential returned only in this response.
            expires_at:
              type: string
              format: date-time
              description: Approximately five minutes after challenge creation.
    Token:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_at]
      properties:
        access_token:
          type: string
          description: Plain-text Sanctum token returned once. Never logged or stored by Laravel in plain text.
        token_type:
          type: string
          const: Bearer
        expires_at:
          type: string
          format: date-time
          description: Exactly 30 days after token issue.
    MobileUser:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - username
        - email
        - phone
        - country_code
        - locale
        - preferred_currency
        - timezone
        - profile_photo_url
        - email_verified_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
          description: Display-only in Mobile M1.
        country_code:
          type: [string, 'null']
        locale:
          type: string
          enum: [ar, en]
        preferred_currency:
          type: string
          example: USD
        timezone:
          type: [string, 'null']
        profile_photo_url:
          type: [string, 'null']
          format: uri
          description: Safe absolute URL generated from the configured public storage disk.
        email_verified_at:
          type: [string, 'null']
          format: date-time
    UserSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/MobileUser'
    LogoutSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [message]
          properties:
            message:
              type: string
              example: Logged out successfully.
    ValidationError:
      type: object
      additionalProperties: false
      required: [message, errors]
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ApiError:
      type: object
      additionalProperties: false
      required: [message, code]
      properties:
        message:
          type: string
        code:
          type: string
          enum:
            - invalid_credentials
            - account_inactive
            - account_blocked
            - customer_role_required
            - invalid_two_factor_challenge
            - invalid_two_factor_code
            - invalid_recovery_code
            - two_factor_attempts_exceeded
            - unauthenticated
            - missing_mobile_ability
            - too_many_requests
            - package_not_found
            - purchasing_unavailable
            - product_unavailable
            - invalid_custom_amount
            - price_changed
            - insufficient_wallet_balance
            - idempotency_conflict
            - idempotency_key_required
            - idempotency_key_invalid
            - checkout_attempt_not_found
            - checkout_in_progress
            - checkout_retry_required
            - checkout_failed
            - order_not_found
        details:
          type: object
          additionalProperties: true
          description: Optional structured context (for example current_quote on price_changed).
    MoneyDisplay:
      type: object
      additionalProperties: false
      required: [currency, formatted]
      properties:
        currency:
          type: string
          description: Actual display currency after trusted server conversion rules (`USD` or `TRY`).
          enum: [USD, TRY]
        formatted:
          type: string
          description: Presentation-only formatted amount. Must not be parsed for calculations.
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency, display]
      properties:
        amount:
          type: string
          pattern: '^-?\d+\.\d{2}$'
          description: Authoritative final ledger amount in USD with two decimal places.
          example: "12.50"
        currency:
          type: string
          const: USD
        display:
          $ref: '#/components/schemas/MoneyDisplay'
    CategoryChip:
      type: object
      additionalProperties: false
      required: [id, name, slug, image_url]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          description: Informational only; not a unique public identifier.
        image_url:
          type: [string, 'null']
          format: uri
          description: Absolute http(s) URL, or null when missing/unsafe. Never an SVG placeholder.
    CategorySummary:
      type: object
      additionalProperties: false
      required: [id, name, slug]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
    CustomAmountConfig:
      type: object
      additionalProperties: false
      required: [min, max, step, unit_label]
      description: |
        Custom amount UI metadata. Values below 1 are normalized to null.
        When the stored configuration is not purchasable under checkout rules
        (for example min greater than max, or min not aligned to step),
        `minimum_price` on the parent product is null and the option is excluded
        from package `from_price`, while this metadata may still be returned.
      properties:
        min:
          type: [integer, 'null']
          minimum: 1
        max:
          type: [integer, 'null']
          minimum: 1
        step:
          type: [integer, 'null']
          minimum: 1
        unit_label:
          type: [string, 'null']
    ProductOption:
      type: object
      additionalProperties: false
      required: [id, name, amount_mode, unit_price, custom_amount, minimum_price]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        amount_mode:
          type: string
          enum: [fixed, custom]
        unit_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: Final customer price for quantity 1 when `amount_mode=fixed`; always null for custom.
        custom_amount:
          oneOf:
            - $ref: '#/components/schemas/CustomAmountConfig'
            - type: 'null'
        minimum_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            For custom products, final customer total using a checkout-valid
            `custom_amount.min`. Null when prices are hidden, configuration is
            incomplete or not purchasable under `CustomAmountValidator` rules,
            or mode is fixed. Never derived from amount 1 unless 1 is the real
            minimum.
    PackageSummary:
      type: object
      additionalProperties: false
      required: [id, name, slug, image_url, products_count, from_price, category]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
          description: Informational only; not a unique public identifier.
        image_url:
          type: [string, 'null']
          format: uri
        products_count:
          type: integer
          minimum: 0
        from_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
          description: |
            Minimum currently purchasable total across active products.
            Fixed products use quantity 1; custom products use `custom_amount.min`.
        category:
          oneOf:
            - $ref: '#/components/schemas/CategorySummary'
            - type: 'null'
    FrequentlyOrderedPackage:
      type: object
      additionalProperties: false
      required: [id, name, slug, image_url, products_count, from_price, category, times_ordered]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        image_url:
          type: [string, 'null']
          format: uri
        products_count:
          type: integer
          minimum: 0
        from_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/CategorySummary'
            - type: 'null'
        times_ordered:
          type: integer
          minimum: 1
    PackageRequirementField:
      type: object
      additionalProperties: false
      required: [key, label, input_type, required, max_length, options]
      description: |
        Sanitized client form metadata. Never includes raw validation rule
        strings. Oversized or malformed labels/options fail closed and are
        omitted or downgraded rather than leaking rule text.
      properties:
        key:
          type: string
          maxLength: 64
        label:
          type: string
          maxLength: 120
        input_type:
          type: string
          enum: [text, number, select]
        required:
          type: boolean
        max_length:
          type: [integer, 'null']
          minimum: 1
          maximum: 255
        options:
          type: [array, 'null']
          maxItems: 32
          items:
            type: string
            maxLength: 64
    PackageDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - slug
        - description
        - image_url
        - products_count
        - from_price
        - category
        - products
        - requirements
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        slug:
          type: string
        description:
          type: [string, 'null']
        image_url:
          type: [string, 'null']
          format: uri
        products_count:
          type: integer
          minimum: 0
        from_price:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        category:
          oneOf:
            - $ref: '#/components/schemas/CategorySummary'
            - type: 'null'
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductOption'
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/PackageRequirementField'
    CatalogHome:
      type: object
      additionalProperties: false
      required: [frequently_ordered, featured_packages, categories]
      properties:
        frequently_ordered:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/FrequentlyOrderedPackage'
        featured_packages:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/PackageSummary'
          description: Admin-ordered package shelf; not sales-ranked.
        categories:
          type: array
          maxItems: 12
          items:
            $ref: '#/components/schemas/CategoryChip'
    CatalogHomeSuccess:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CatalogHome'
        meta:
          $ref: '#/components/schemas/CatalogMeta'
    PackageListSuccess:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PackageSummary'
        meta:
          $ref: '#/components/schemas/PackageListMeta'
    PackageDetailSuccess:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/PackageDetail'
        meta:
          $ref: '#/components/schemas/CatalogMeta'
    CatalogMeta:
      type: object
      additionalProperties: false
      required: [prices_visible]
      properties:
        prices_visible:
          type: boolean
          description: When false, all money fields are null while keys remain present.
    PackageListMeta:
      type: object
      additionalProperties: false
      required: [prices_visible, pagination]
      properties:
        prices_visible:
          type: boolean
        pagination:
          $ref: '#/components/schemas/OffsetPagination'
    OffsetPagination:
      type: object
      additionalProperties: false
      required: [page, per_page, total, last_page]
      properties:
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        last_page:
          type: integer
          minimum: 1
    CheckoutLineItemRequest:
      type: object
      additionalProperties: false
      required: [product_id]
      properties:
        product_id:
          type: integer
          minimum: 1
        package_id:
          type: [integer, 'null']
          minimum: 1
        quantity:
          type: [integer, 'null']
        requested_amount:
          type: [integer, 'null']
        requirements:
          type: object
          additionalProperties: true
          description: Fulfillment input values. Sensitive; never logged or returned in receipts.
        unit_price:
          description: Prohibited. Client prices are never trusted.
        line_total:
          description: Prohibited.
        total:
          description: Prohibited.
        price:
          description: Prohibited.
    CheckoutQuoteRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/CheckoutLineItemRequest'
        total:
          description: Prohibited.
        subtotal:
          description: Prohibited.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [items, quote_fingerprint]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/CheckoutLineItemRequest'
        quote_fingerprint:
          type: string
          minLength: 16
          maxLength: 2048
        total:
          description: Prohibited.
        subtotal:
          description: Prohibited.
    CheckoutQuoteLine:
      type: object
      additionalProperties: false
      required:
        - product_id
        - package_id
        - name
        - amount_mode
        - quantity
        - requested_amount
        - unit_price
        - line_total
        - requirements_schema
      properties:
        product_id:
          type: integer
        package_id:
          type: integer
        name:
          type: string
        amount_mode:
          type: string
          enum: [fixed, custom]
        quantity:
          type: integer
          minimum: 1
        requested_amount:
          type: [integer, 'null']
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
        requirements_schema:
          type: array
          items:
            $ref: '#/components/schemas/PackageRequirementField'
    CheckoutQuote:
      type: object
      additionalProperties: false
      required:
        - quote_fingerprint
        - expires_at
        - item
        - subtotal
        - fee
        - total
        - wallet
        - meta
      properties:
        quote_fingerprint:
          type: string
        expires_at:
          type: string
          format: date-time
        item:
          $ref: '#/components/schemas/CheckoutQuoteLine'
        subtotal:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        wallet:
          type: object
          additionalProperties: false
          required: [available_to_spend, can_afford]
          properties:
            available_to_spend:
              $ref: '#/components/schemas/Money'
            can_afford:
              type: boolean
        meta:
          $ref: '#/components/schemas/CatalogMeta'
    CheckoutQuoteSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/CheckoutQuote'
    WalletSummarySuccess:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [available_to_spend]
          properties:
            available_to_spend:
              $ref: '#/components/schemas/Money'
        meta:
          $ref: '#/components/schemas/CatalogMeta'
    PurchaseReceiptItem:
      type: object
      additionalProperties: false
      required:
        - product_id
        - package_id
        - name
        - amount_mode
        - quantity
        - requested_amount
        - line_total
      properties:
        product_id:
          type: [integer, 'null']
        package_id:
          type: [integer, 'null']
        name:
          type: string
        amount_mode:
          type: string
          enum: [fixed, custom]
        quantity:
          type: integer
        requested_amount:
          type: [integer, 'null']
        line_total:
          $ref: '#/components/schemas/Money'
    FulfillmentStatus:
      type: string
      enum: [pending, queued, processing, completed, failed, cancelled]
      description: |
        Customer-safe aggregate fulfillment progress derived from fulfillment rows.
        Unfinished units (queued/processing) keep the aggregate non-terminal even
        when some units have failed.
    CustomerOrderState:
      type: string
      enum: [needs_attention, in_progress, delivered, refunded, other]
      description: Canonical customer-order classification for list badges.
    FulfillmentSummary:
      type: object
      additionalProperties: false
      required: [total, queued, processing, completed, failed, cancelled]
      properties:
        total:
          type: integer
          minimum: 0
        queued:
          type: integer
          minimum: 0
        processing:
          type: integer
          minimum: 0
        completed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
    OrderListItem:
      type: object
      additionalProperties: false
      required:
        - order_number
        - created_at
        - paid_at
        - currency
        - total
        - payment_status
        - fulfillment_status
        - customer_state
        - title
        - item_count
      properties:
        order_number:
          type: string
          example: ORD-2026-000001
        created_at:
          type: string
          format: date-time
        paid_at:
          type: [string, 'null']
          format: date-time
        currency:
          type: string
          const: USD
        total:
          $ref: '#/components/schemas/Money'
        payment_status:
          type: string
          enum: [paid, pending_payment, processing, fulfilled, failed, refunded, cancelled]
        fulfillment_status:
          $ref: '#/components/schemas/FulfillmentStatus'
        customer_state:
          $ref: '#/components/schemas/CustomerOrderState'
        title:
          type: [string, 'null']
          description: First order-item snapshot name by item id, or null when empty.
        item_count:
          type: integer
          minimum: 0
          description: Count of order items (not fulfillment units).
    OrderListMeta:
      type: object
      additionalProperties: false
      required: [pagination]
      properties:
        pagination:
          $ref: '#/components/schemas/OffsetPagination'
    OrderListSuccess:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OrderListItem'
        meta:
          $ref: '#/components/schemas/OrderListMeta'
    PurchaseReceipt:
      type: object
      additionalProperties: false
      required:
        - order_number
        - status
        - payment_status
        - currency
        - total
        - paid_at
        - created_at
        - fulfillment_status
        - customer_state
        - fulfillment_summary
        - items
      properties:
        order_number:
          type: string
        status:
          type: string
          description: Raw order status value. Not customer delivery progress.
        payment_status:
          type: string
          enum: [paid, pending_payment, processing, fulfilled, failed, refunded, cancelled]
          description: Payment-layer status. Legacy processing/fulfilled map to paid at runtime.
        currency:
          type: string
          const: USD
        total:
          $ref: '#/components/schemas/Money'
        paid_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        fulfillment_status:
          $ref: '#/components/schemas/FulfillmentStatus'
        customer_state:
          $ref: '#/components/schemas/CustomerOrderState'
        fulfillment_summary:
          $ref: '#/components/schemas/FulfillmentSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/PurchaseReceiptItem'
    CheckoutSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [replayed, order]
          properties:
            replayed:
              type: boolean
            order:
              $ref: '#/components/schemas/PurchaseReceipt'
    CheckoutStatusSuccess:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              type: string
              enum: [completed, failed]
            replayed:
              type: boolean
            order:
              $ref: '#/components/schemas/PurchaseReceipt'
            code:
              type: [string, 'null']
    CheckoutStatusProcessing:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [state, retry_after_seconds]
          properties:
            state:
              type: string
              const: processing
            retry_after_seconds:
              type: integer
              minimum: 1
